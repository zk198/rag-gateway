name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --extra test
      - run: uv run pytest
      - run: docker build --progress=plain -t rag-gateway:ci .

      - name: Smoke test Docker HTTP endpoints
        run: |
          docker run -d --rm --name rag-gateway-ci -p 18200:8200 \
            -e RAG_RETRIEVAL_URL=http://127.0.0.1:8100 \
            -e RAG_INGESTION_URL=http://127.0.0.1:8100 \
            -e RAG_JWT_SECRET=e2e-ci-only-secret \
            rag-gateway:ci
          cleanup() { docker rm -f rag-gateway-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18200/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:18200/healthz >/dev/null
          status=$(curl -sS -o /tmp/mcp-smoke.out -w '%{http_code}' \
            -H 'Accept: application/json, text/event-stream' \
            http://localhost:18200/mcp/)
          case "$status" in
            401|405|406) ;;
            *) echo "unexpected /mcp/ status: $status"; cat /tmp/mcp-smoke.out; exit 1 ;;
          esac
